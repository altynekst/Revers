name: AssetRipper Find Files
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y unzip zip
      - name: Clone and Build
        run: |
          git clone --depth 1 https://github.com/AssetRipper/AssetRipper.git
          cd AssetRipper
          # Собираем вообще всё, что есть
          dotnet build -c Release
      - name: Find DLLs
        run: |
          echo '=== Все файлы .dll в папке AssetRipper ==='
          find AssetRipper -name '*.dll' | sort
          echo '=== Все файлы .exe в папке AssetRipper ==='
          find AssetRipper -name '*.exe' | sort
          echo '=== Все исполняемые файлы в папке AssetRipper ==='
          find AssetRipper -type f -executable | sort
