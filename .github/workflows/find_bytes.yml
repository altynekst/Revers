name: Find Bytes Locally
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y unzip
      - name: Find Bytes
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk -d work
          echo '=== Ищем в обычном тексте ==='
          grep -rl NOOMIUNLOCKED work/ || true
          echo '=== Ищем в UTF-16 (Unity) ==='
          grep -rl $'N\x00O\x00O\x00M\x00I\x00U\x00N\x00L\x00O\x00C\x00K\x00E\x00D\x00' work/ || true
          echo '=== Готово ==='
