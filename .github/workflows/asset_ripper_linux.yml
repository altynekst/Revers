name: AssetRipper Linux
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y unzip zip
          # Скачиваем LINUX версию AssetRipper
          curl -L -sS -o AssetRipper.zip https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_linux_x64.zip
          unzip -q AssetRipper.zip -d AssetRipper
          chmod +x AssetRipper/AssetRipper
      - name: Export Unity
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk -d work
          # Запускаем линуксовый бинарник
          ./AssetRipper/AssetRipper work -o export
          ls -la export || true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-export
          path: export/
