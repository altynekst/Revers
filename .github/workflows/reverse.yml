name: reverse-apk
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'arch for .so strings'
        required: false
        default: 'arm64-v8a'

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool aapt binutils unzip file >/dev/null
          JADX_TAG=$(curl -sS https://api.github.com/repos/skylot/jadx/releases/latest | jq -r .tag_name)
          JADX_VER=${JADX_TAG#v}
          curl -sSL -o /tmp/jadx.zip "https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VER}.zip"
          sudo mkdir -p /opt/jadx && sudo unzip -o -q /tmp/jadx.zip -d /opt/jadx
          echo "/opt/jadx/bin" >> $GITHUB_PATH
          jadx --version || true

      - name: Badging / permissions
        run: |
          mkdir -p out
          APK=$(find apk -name '*.apk' | head -1)
          echo "APK=$APK"
          aapt dump badging "$APK" > out/badging.txt || true
          aapt dump permissions "$APK" > out/permissions.txt || true

      - name: apktool decode (smali + res)
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          apktool d -f "$APK" -o out/apktool >/dev/null
          du -sh out/apktool

      - name: jadx decode (java)
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          jadx -d out/jadx --no-res "$APK" 2>&1 | tail -20
          du -sh out/jadx

      - name: Native .so strings
        run: |
          mkdir -p out/native_strings
          find out/apktool -type f -name '*.so' | while read -r so; do
            base=$(echo "$so" | sed 's#/#_#g')
            strings -n 6 "$so" > "out/native_strings/${base}.strings.txt" || true
            file "$so" >> out/native_strings/_file_list.txt || true
          done
          echo "so count: $(find out/apktool -name '*.so' | wc -l)"

      - name: Pack results
        run: |
          cd out
          [ -d jadx ]           && zip -qr jadx_src.zip jadx                 || true
          [ -d apktool ]        && zip -qr apktool_smali.zip apktool         || true
          [ -d native_strings ] && zip -qr native_strings.zip native_strings || true
          tar -czf misc.tar.gz badging.txt permissions.txt 2>/dev/null       || true
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noomi-reverse
          path: |
            out/jadx_src.zip
            out/apktool_smali.zip
            out/native_strings.zip
            out/misc.tar.gz
          if-no-files-found: warn
          retention-days: 14