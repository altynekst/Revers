name: Dump All 3D Texts
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install UnityPy
      - name: Extract
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk 'assets/bin/Data/level*' -d work
          mkdir -p found
          python3 - << 'PY'
          import UnityPy, os, json
          for root, dirs, files in os.walk('work'):
              for f in files:
                  if f.startswith('level'):
                      p = os.path.join(root, f)
                      try:
                          env = UnityPy.load(p)
                          for obj in env.objects:
                              if obj.type.name in ['MonoBehaviour', 'TextMesh', 'Text']:
                                  try:
                                      data = obj.read_typetree()
                                      # Ищем любые текстовые поля
                                      text = data.get('m_Text', '')
                                      if text and str(text).strip() != '':
                                          with open(f'found/{f}_texts.txt', 'a', encoding='utf-8') as out:
                                              out.write(f'File: {f} | Obj: {obj.type.name} | Text: {text}\n')
                                  except Exception: pass
                      except Exception: pass
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-texts
          path: found/
