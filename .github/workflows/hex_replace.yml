name: Hex Replace Text
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch Hex
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk
          python3 - << 'PY'
          import os
          # Байты для замены (UTF-16LE)
          old = b'N\x00O\x00O\x00M\x00I\x00U\x00N\x00L\x00O\x00C\x00K\x00E\x00D\x00'
          new = b'c\x00r\x00a\x00c\x00k\x00 \x00b\x00y\x00 \x00t\x00u\x00m\x00a\x00'
          replaced = 0
          for root, dirs, files in os.walk('res'):
              for f in files:
                  p = os.path.join(root, f)
                  if p.endswith('.xml') or p.endswith('.png'):
                      try:
                          with open(p, 'rb') as file:
                              data = file.read()
                          if old in data:
                              data = data.replace(old, new)
                              with open(p, 'wb') as file:
                                  file.write(data)
                              print(f'Заменено в: {p}')
                              replaced += 1
                      except Exception as e: pass
          print(f'Всего заменено файлов: {replaced}')
          PY
          cd ..
          cp apk/NoomiUnlocked.apk final.apk
          cd work
          zip -q -0 -r ../final.apk res/
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Crack.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Crack.apk
