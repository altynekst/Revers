name: Find And Replace Text
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch All
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk
          python3 - << 'PY'
          import os
          old = b'NOOMIUNLOCKED'
          new = b'crack by tuman'
          old16 = 'NOOMIUNLOCKED'.encode('utf-16le')
          new16 = 'crack by tuman'.encode('utf-16le')
          count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  try:
                      with open(p, 'rb') as file: data = file.read()
                      changed = False
                      if old in data:
                          data = data.replace(old, new)
                          changed = True
                      if old16 in data:
                          data = data.replace(old16, new16)
                          changed = True
                      if changed:
                          with open(p, 'wb') as file: file.write(data)
                          print(f'Изменен: {p}')
                          count += 1
                  except Exception: pass
          print(f'ВСЕГО ФАЙЛОВ ИЗМЕНЕНО: {count}')
          PY
          cd ..
          # Собираем обратно ВООБЩЕ ВСЁ
          rm -f final.apk
          cd work
          zip -q -r ../final.apk .
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Crack.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Crack.apk
