name: Find Localization Text
on: workflow_dispatch

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install UnityPy
        run: pip install UnityPy
      - name: Extract and Search Text
        run: |
          mkdir -p extract
          unzip -q apk/NoomiUnlocked.apk "assets/aa/Android/localization-string-tables-russian(ru)_assets_all.bundle" -d extract
          python3 - << 'PY'
import UnityPy, json
path = "extract/assets/aa/Android/localization-string-tables-russian(ru)_assets_all.bundle"
env = UnityPy.load(path)
found = []
for obj in env.objects:
    if obj.type.name == "MonoBehaviour":
        try:
            tree = obj.read_typetree()
            with open("extract/dump.json", "a", encoding="utf-8") as f:
                f.write(json.dumps(tree, ensure_ascii=False) + "\n")
        except Exception:
            pass
print("Дамп завершен")
PY
          grep -oE '"[^"]+"' extract/dump.json | head -100 > extract/strings.txt || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: localization-dump
          path: |
            extract/dump.json
            extract/strings.txt
