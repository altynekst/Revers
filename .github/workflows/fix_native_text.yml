name: Fix Native Text
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch
        run: |
          mkdir -p work && cd work
          # Вытаскиваем сцену level1 из оригинального APK
          unzip -q ../apk/NoomiUnlocked.apk 'assets/bin/Data/level1'
          python3 - << 'PY'
          p = 'assets/bin/Data/level1'
          with open(p, 'rb') as f: data = bytearray(f.read())
          old = b'NOOMICLONE'
          new = b'crack by tuman'
          idx = data.find(old)
          if idx != -1:
              print(f'Нашли на позиции {idx}. Меняем...')
              # Заменяем ровно столько байт, сколько было (10 байт), остальное обрезаем
              data[idx:idx+10] = new[:10]
              with open(p, 'wb') as f: f.write(data)
              print('Успешно заменено на crack by t')
          else:
          PY
          cd ..
          cp apk/NoomiUnlocked.apk final.apk
          # Заменяем файл в APK без сжатия
          zip -q -0 -j final.apk work/assets/bin/Data/level1
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Fixed.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Fixed.apk
