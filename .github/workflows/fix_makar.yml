name: Fix Makar Name
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install UnityPy && sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner
      - name: Patch
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk "assets/aa/Android/localization-string-tables-russian(ru)_assets_all.bundle"
          python3 -c "import UnityPy; env = UnityPy.load('assets/aa/Android/localization-string-tables-russian(ru)_assets_all.bundle'); [item.update({'m_Localized': 'Макар1488'}) for obj in env.objects if obj.type.name == 'MonoBehaviour' for data in [obj.read_typetree()] if 'm_TableData' in data for item in data['m_TableData'] if item.get('m_Localized') == 'NoomiCheems' for _ in [obj.save_typetree(data)]]; env.save()"
          cd .. && cp apk/NoomiUnlocked.apk final.apk
          zip -q -0 -j final.apk work/assets/aa/Android/localization-string-tables-russian(ru)_assets_all.bundle
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Makar.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Makar.apk
