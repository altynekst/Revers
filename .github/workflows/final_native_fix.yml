name: Native Final Fix
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch Native
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk 'lib/arm64-v8a/libil2cpp.so'
          python3 - << 'PY'
          import os
          p = 'lib/arm64-v8a/libil2cpp.so'
          with open(p, 'rb') as f: data = bytearray(f.read())
          # Ищем строку в UTF-8
          old = b'NOOMIUNLOCKED'
          new = b'crack by tuman'
          idx = data.find(old)
          if idx != -1:
              data[idx:idx+len(new)] = new
              with open(p, 'wb') as f: f.write(data)
              print('Заменено в libil2cpp.so')
          else:
              print('В libil2cpp не найдено. Пробуем global-metadata.dat')
          PY
          cd ..
          cp apk/NoomiUnlocked.apk final.apk
          cd work
          zip -q -0 -r ../final.apk 'lib/arm64-v8a/libil2cpp.so'
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Crack.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Crack.apk
