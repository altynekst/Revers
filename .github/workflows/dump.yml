name: Dump IL2CPP
on: workflow_dispatch

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y unzip >/dev/null
      - name: Extract libs
        run: |
          mkdir -p extract
          unzip -q apk/NoomiUnlocked.apk "lib/arm64-v8a/libil2cpp.so" -d extract
          unzip -q apk/NoomiUnlocked.apk "assets/bin/Data/Managed/Metadata/global-metadata.dat" -d extract
      - name: Clone and Build Il2CppDumper
        run: |
          git clone https://github.com/Perfare/Il2CppDumper.git
          cd Il2CppDumper
          dotnet build Il2CppDumper/Il2CppDumper.csproj -c Release
          cd ..
      - name: Run Dumper
        run: |
          cd extract
          dotnet ../Il2CppDumper/Il2CppDumper/bin/Release/net8.0/Il2CppDumper.dll lib/arm64-v8a/libil2cpp.so assets/bin/Data/Managed/Metadata/global-metadata.dat out
          ls -lh out/
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-dump
          path: extract/out/
