name: Replace Metadata Text
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner
      - name: Patch
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk 'assets/bin/Data/Managed/Metadata/global-metadata.dat'
          cd ..
          python3 replace.py
          cp apk/NoomiUnlocked.apk final.apk
          zip -q -0 -j final.apk work/assets/bin/Data/Managed/Metadata/global-metadata.dat
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Crack.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Crack.apk
