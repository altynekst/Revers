name: Extract Text Objects
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install UnityPy
      - name: Extract
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk 'assets/bin/Data/level*' -d work
          python3 - << 'PY'
          import UnityPy, os
          os.makedirs('found_texts', exist_ok=True)
          for root, dirs, files in os.walk('work'):
              for f in files:
                  if f.startswith('level'):
                      p = os.path.join(root, f)
                      try:
                          env = UnityPy.load(p)
                          for obj in env.objects:
                              if obj.type.name in ['TextMesh', 'Text', 'MonoBehaviour']:
                                  try:
                                      data = obj.read_typetree()
                                      text_val = str(data.get('m_Text', ''))
                                      if text_val and ('NOOMI' in text_val.upper() or 'UNLOCKED' in text_val.upper()):
                                          with open(f'found_texts/{f}_found.txt', 'a') as out:
                                              out.write(f'Obj: {obj.type.name}, PathID: {obj.path_id}, Text: {text_val}\n')
                                  except Exception: pass
                      except Exception: pass
          print('Поиск завершен')
          PY
          ls -lh found_texts/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: found-texts
          path: found_texts/
