name: Mod APK (No Ads via DNS)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool zipalign apksigner >/dev/null
      - name: Unpack APK
        run: apktool d -f apk/NoomiClone.apk -o work
      - name: Patch Network Security Config
        run: |
          cd work
          # Создаем файл конфигурации, который блокирует рекламные домены
          mkdir -p res/xml
          cat > res/xml/network_security_config.xml << XML
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">googleads.g.doubleclick.net</domain>
                  <domain includeSubdomains="true">pagead2.googlesyndication.com</domain>
                  <domain includeSubdomains="true">adservice.google.com</domain>
                  <domain includeSubdomains="true">ads.vungle.com</domain>
                  <domain includeSubdomains="true">api.vungle.com</domain>
                  <domain includeSubdomains="true">gateway.unityads.unity3d.com</domain>
                  <domain includeSubdomains="true">yandex.net</domain>
                  <domain includeSubdomains="true">appmetrica.yandex.net</domain>
                  <domain includeSubdomains="true">ironsource.mobi</domain>
                  <domain includeSubdomains="true">supersonicads.com</domain>
                  <domain includeSubdomains="true">imp.adplus.co.id</domain>
              </domain-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML
          # Внедряем этот конфиг в манифест
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' AndroidManifest.xml
      - name: Rebuild
        run: apktool b work -o unsigned.apk
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 unsigned.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-mod.apk aligned.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-mod.apk
