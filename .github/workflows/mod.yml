name: Mod APK (Fast Zip Patch)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool zipalign apksigner zip >/dev/null
          # Находим, куда установился apktool, и делаем на него ссылку
          APKTOOL_JAR=$(find /usr/share -name "apktool.jar" | head -n 1)
          if [ -z "$APKTOOL_JAR" ]; then APKTOOL_JAR="/usr/share/java/apktool.jar"; fi
          echo "APKTOOL_JAR=$APKTOOL_JAR" >> $GITHUB_ENV
      - name: Unpack, Patch and Rebuild classes.dex
        run: |
          mkdir -p work
          cd work
          # Распаковываем только DEX
          unzip -q ../apk/NoomiClone.apk "classes*.dex"
          
          for dex in classes*.dex; do
            # Декомпилируем DEX в smali
            java -jar "$APKTOOL_JAR" d "$dex" -o "smali_$dex"
            
            # Вырезаем рекламу
            find "smali_$dex" -name "*.smali" -exec sed -i 's/invoke-static {.*}, Lcom\/yandex\/mobile\/ads\/MobileAds;->initialize.*//g' {} +
            find "smali_$dex" -name "*.smali" -exec sed -i 's/invoke-virtual {.*}, Lcom\/vungle\/Vungle;->init.*//g' {} +
            find "smali_$dex" -name "*.smali" -exec sed -i 's/invoke-static {.*}, Lcom\/ironsource\/IronSource;->init.*//g' {} +
            
            # Собираем обратно DEX
            java -jar "$APKTOOL_JAR" b "smali_$dex" -o "$dex" -c
            rm -rf "smali_$dex"
          done
          
          # Заменяем старые DEX на новые прямо в APK
          cd ..
          cp apk/NoomiClone.apk patched.apk
          zip -q -j patched.apk work/classes*.dex
      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 patched.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-mod.apk aligned.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-mod.apk
