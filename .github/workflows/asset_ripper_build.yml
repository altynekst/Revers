name: AssetRipper From Source
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y unzip zip
      - name: Clone AssetRipper
        run: |
          git clone --depth 1 https://github.com/AssetRipper/AssetRipper.git
          cd AssetRipper
          # Собираем CLI-версию
          dotnet build AssetRipper.CLI/AssetRipper.CLI.csproj -c Release
      - name: Export Unity
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk -d work
          # Запускаем собранный CLI
          dotnet AssetRipper/AssetRipper.CLI/bin/Release/net8.0/AssetRipper.CLI.dll work -o export
          ls -la export || true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-export
          path: export/
