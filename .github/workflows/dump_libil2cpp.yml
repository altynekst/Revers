name: Dump Libil2cpp Strings
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y unzip binutils
      - name: Extract Strings
        run: |
          mkdir -p work && cd work
          unzip -q ../apk/NoomiUnlocked.apk 'lib/arm64-v8a/libil2cpp.so'
          strings -n 5 lib/arm64-v8a/libil2cpp.so > all_strings.txt
          strings -el -n 5 lib/arm64-v8a/libil2cpp.so > all_strings_utf16.txt || true
          grep -i noomi all_strings.txt all_strings_utf16.txt | head -50 > found_noomi.txt || true
          grep -i unlock all_strings.txt all_strings_utf16.txt | head -50 > found_unlock.txt || true
          cat found_noomi.txt
          echo '---' 
          cat found_unlock.txt
      - uses: actions/upload-artifact@v4
        with:
          name: strings
          path: work/*.txt
