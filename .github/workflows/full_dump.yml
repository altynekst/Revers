name: Full Dump Everything
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y unzip zip
      - name: Dump All
        run: |
          mkdir -p work
          # Распаковываем ВООБЩЕ ВСЁ из APK
          unzip -q apk/NoomiUnlocked.apk -d work
          # Делаем тотальный поиск по ВСЕМ файлам на любые упоминания NOOMI
          echo '=== Поиск во всех файлах (обычный текст) ==='
          grep -r -a -i -l 'noomiunlock' work/ || true
          grep -r -a -i -l 'noomi' work/ | grep -v '\.txt' | head -20
          echo '=== Поиск в бинарниках (UTF-16) ==='
          find work -type f -exec file {} \; | grep -i 'data\|binary' | cut -d: -f1 | head -50 | while read f; do strings -el "$f" 2>/dev/null | grep -i 'noomi' && echo "  ^ Найдено в: $f"; done || true
          echo '=== Готово ==='
      - name: Create Archive
        run: |
          # Пакуем все найденные ресурсы в один архив, чтобы скачать
          zip -q -r dump.zip work/assets work/res work/lib || true
      - uses: actions/upload-artifact@v4
        with:
          name: full-dump
          path: dump.zip
