name: AssetRipper Export
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y unzip zip zipalign apksigner
          curl -L -sS -o AssetRipper.zip https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_win_x64.zip
          unzip -q AssetRipper.zip -d AssetRipper
      - name: Export Unity
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk -d work
          # Запускаем экспорт (если это Linux версия, то через dotnet)
          dotnet AssetRipper/AssetRipper.CLI.dll work -o export || dotnet AssetRipper/AssetRipper.dll work -o export || true
          ls export || true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-export
          path: export/
