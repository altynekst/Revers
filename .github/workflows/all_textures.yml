name: Extract All Textures
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install UnityPy
      - name: Extract
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk 'assets/*' -d work
          python3 - << 'PY'
          import UnityPy, os
          os.makedirs('textures', exist_ok=True)
          for root, dirs, files in os.walk('work'):
              for f in files:
                  p = os.path.join(root, f)
                  if f.endswith('.bundle') or f.endswith('.assets') or f.endswith('.split0') or f.endswith('.split1'):
                      try:
                          env = UnityPy.load(p)
                          for obj in env.objects:
                              if obj.type.name in ['Texture2D', 'Sprite']:
                                  try:
                                      data = obj.read()
                                      name = getattr(data, 'm_Name', 'unknown')
                                      img = data.image
                                      if img:
                                          img.save(f'textures/{name}.png')
                                  except Exception: pass
                      except Exception: pass
          print('Готово')
          PY
          ls textures | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: all-textures
          path: textures/
