name: Frida Inject
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip unzip
          pip install frida-tools
      - name: Create Frida Hook
        run: |
          cat > hook.js << 'JS'
          Java.perform(function() {
              var String = Java.use('java.lang.String');
              String.toString.implementation = function() {
                  var result = this.toString();
                  if (result.includes('NOOMIUNLOCKED')) {
                      console.log('[!] Found in String: ' + result);
                      return result.replace('NOOMIUNLOCKED', 'crack by tuman');
                  }
                  return result;
              };
              // Хукаем Unity TextMesh
              var TextMesh = Java.use('UnityEngine.TextMesh');
              TextMesh.set_text.implementation = function(newText) {
                  if (newText && newText.includes('NOOMIUNLOCKED')) {
                      newText = newText.replace('NOOMIUNLOCKED', 'crack by tuman');
                  }
                  this.set_text(newText);
              };
          });
          JS
      - name: Upload Frida Hook
        uses: actions/upload-artifact@v4
        with:
          name: frida-hook
          path: hook.js
