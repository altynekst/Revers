name: AssetRipper Final
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y unzip zip
      - name: Clone and Build
        run: |
          git clone --depth 1 https://github.com/AssetRipper/AssetRipper.git
          cd AssetRipper
          dotnet build -c Release
      - name: Export Unity
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk -d work
          # Ищем официальный скрипт запуска AssetRipper
          RUNNER=$(find AssetRipper -name 'AssetRipper.sh' | head -n 1)
          if [ -z "$RUNNER" ]; then RUNNER=$(find AssetRipper -name '*.sh' | grep -i 'AssetRipper' | head -n 1); fi
          echo "Нашли скрипт запуска: $RUNNER"
          chmod +x "$RUNNER"
          # Запускаем его
          bash "$RUNNER" work -o export
          ls -la export || true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-export
          path: export/
