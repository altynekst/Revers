name: Replace DLL Text
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch DLL
        run: |
          mkdir -p work && cd work
          # Распаковываем вообще все DLL
          unzip -q ../apk/NoomiUnlocked.apk 'assets/bin/Data/Managed/*.dll'
          unzip -q ../apk/NoomiUnlocked.apk 'assets/aa/Android/*.bundle'
          python3 - << 'PY'
          import os, glob
          # Ищем во всех DLL и бандлах строку NOOMIUNLOCKED
          old = b'NOOMIUNLOCKED'
          new = b'crack by tuman'
          count = 0
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith('.dll') or f.endswith('.bundle'):
                      p = os.path.join(root, f)
                      with open(p, 'rb') as file: data = file.read()
                      if old in data:
                          print(f'НАШЛИ В: {p}')
                          with open(p, 'wb') as file: file.write(data.replace(old, new))
                          count += 1
          print(f'ВСЕГО ФАЙЛОВ ИЗМЕНЕНО: {count}')
          PY
          cd ..
          # Собираем оригинальный APK с новыми файлами
          cp apk/NoomiUnlocked.apk final.apk
          cd work
          # Заменяем только измененные файлы
          zip -q -0 -r ../final.apk assets/ 
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-FinalText.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-FinalText.apk
