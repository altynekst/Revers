name: Patch Settings JSON
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y zipalign apksigner python3
      - name: Patch Settings
        run: |
          mkdir -p work
          unzip -q apk/NoomiUnlocked.apk 'assets/aa/settings.json' -d work
          python3 - << 'PY'
          p = 'work/assets/aa/settings.json'
          with open(p, 'rb') as f: data = f.read()
          old = 'NOOMIUNLOCKED'.encode('utf-16le')
          new = 'crack by tuman'.encode('utf-16le')
          if old in data:
              data = data.replace(old, new)
              with open(p, 'wb') as f: f.write(data)
          else:
              print('Не найдено в settings.json')
          PY
          cp apk/NoomiUnlocked.apk final.apk
          zip -q -0 -j final.apk work/assets/aa/settings.json
      - name: Sign
        run: |
          keytool -genkeypair -v -keystore my.keystore -alias noomi -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Noomi, O=Mod, C=NL"
          zipalign -p 4 final.apk aligned.apk || cp final.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:123456 --key-pass pass:123456 --out NoomiClone-Settings.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mod-apk
          path: NoomiClone-Settings.apk
